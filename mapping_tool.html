<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ILLAR Mapping Tool</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #111;
      color: #ddd;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: #1c1c1c;
      border-bottom: 1px solid #2a2a2a;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    header h1 { font-size: 0.95rem; font-weight: 700; color: #fff; letter-spacing: 0.02em; }
    .sep { color: #444; }
    #url-input {
      background: #252525;
      border: 1px solid #333;
      color: #ddd;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 0.85rem;
      width: 210px;
    }
    #url-input:focus { outline: none; border-color: #4a90e2; }
    .hbtn {
      padding: 5px 14px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.15s;
    }
    #btn-connect { background: #2563eb; color: #fff; }
    #btn-connect:hover { background: #1d4ed8; }
    #btn-connect:disabled { background: #333; color: #666; cursor: default; }
    #status-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #444; flex-shrink: 0;
      transition: background 0.3s;
    }
    #status-dot.ok  { background: #22c55e; }
    #status-dot.err { background: #ef4444; }
    #device-info { font-size: 0.78rem; color: #777; }

    /* ── Main layout ── */
    main { display: flex; flex: 1; overflow: hidden; }

    /* ── LED grid panel ── */
    #grid-panel {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #grid-header {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    #grid-header h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: #555; }
    #grid-hint { font-size: 0.75rem; color: #444; }
    #led-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      align-content: flex-start;
      user-select: none;
    }
    .led {
      width: 32px;
      height: 32px;
      border-radius: 5px;
      background: #222;
      cursor: pointer;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: #444;
      transition: transform 0.05s;
      flex-shrink: 0;
    }
    .led:hover { transform: scale(1.12); z-index: 1; }
    .led.sel {
      border-color: #fbbf24 !important;
      background: #3d2e00 !important;
      color: #fbbf24 !important;
    }
    .led.assigned { color: rgba(0,0,0,0.45); }
    #grid-empty { color: #444; font-size: 0.85rem; padding: 8px; }

    /* ── Sidebar ── */
    aside {
      width: 290px;
      background: #161616;
      border-left: 1px solid #222;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* Assign pane */
    #assign-pane {
      padding: 14px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }
    #assign-pane h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: #555; margin-bottom: 10px; }
    #sel-info { font-size: 0.8rem; color: #666; margin-bottom: 8px; }
    .field-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }
    .field-row label { font-size: 0.78rem; color: #666; width: 54px; flex-shrink: 0; }
    .field-row input[type=text] {
      flex: 1;
      background: #1f1f1f;
      border: 1px solid #2e2e2e;
      color: #ddd;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .field-row input[type=text]:focus { outline: none; border-color: #4a90e2; }
    .field-row input[type=color] {
      width: 36px; height: 26px;
      border: none; background: none;
      cursor: pointer; padding: 0; border-radius: 3px;
    }
    #btn-assign {
      width: 100%;
      padding: 7px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      background: #16a34a;
      color: #fff;
      margin-top: 2px;
    }
    #btn-assign:hover { background: #15803d; }
    #btn-assign:disabled { background: #252525; color: #555; cursor: default; }
    #btn-clear-sel {
      width: 100%;
      margin-top: 5px;
      padding: 5px;
      border-radius: 4px;
      border: 1px solid #2a2a2a;
      background: transparent;
      color: #666;
      cursor: pointer;
      font-size: 0.78rem;
    }
    #btn-clear-sel:hover { background: #1e1e1e; color: #aaa; }

    /* Location list */
    #loc-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }
    #loc-wrap h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #555;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #loc-list { display: flex; flex-direction: column; gap: 3px; }
    .loc-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      border-radius: 5px;
      border: 1px solid #222;
      background: #1a1a1a;
      cursor: pointer;
    }
    .loc-row:hover { background: #202020; }
    .loc-row.active { border-color: #3b82f6; background: #0f1f33; }
    .loc-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .loc-name { flex: 1; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .loc-count { font-size: 0.72rem; color: #555; flex-shrink: 0; }
    .loc-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 1px 3px;
      font-size: 0.9rem;
      color: #444;
      line-height: 1;
      flex-shrink: 0;
    }
    .loc-btn:hover { color: #aaa; }
    .loc-btn.del:hover { color: #ef4444; }
    .loc-empty { color: #3a3a3a; font-size: 0.82rem; text-align: center; padding: 18px 0; }

    /* Actions / footer */
    #actions {
      padding: 12px 14px;
      border-top: 1px solid #222;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .abtn {
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.83rem;
      font-weight: 600;
      border: none;
      width: 100%;
    }
    #btn-load   { background: #1f1f1f; border: 1px solid #2e2e2e; color: #aaa; }
    #btn-load:hover { background: #252525; }
    #btn-export { background: #1f1f1f; border: 1px solid #2e2e2e; color: #aaa; }
    #btn-export:hover { background: #252525; }
    #btn-upload { background: #7c3aed; color: #fff; }
    #btn-upload:hover { background: #6d28d9; }
    #btn-upload:disabled { background: #252525; color: #555; cursor: default; }
    #upload-msg { font-size: 0.75rem; color: #555; text-align: center; min-height: 14px; }
    #upload-msg.ok  { color: #22c55e; }
    #upload-msg.err { color: #ef4444; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: #2a2a2a;
      color: #ddd;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 0.82rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s, transform 0.15s;
      z-index: 99;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <h1>ILLAR Mapping Tool</h1>
  <span class="sep">|</span>
  <input id="url-input" type="text" placeholder="http://led-node-1.local" value="http://led-node-1.local">
  <button class="hbtn" id="btn-connect">Verbinden</button>
  <div id="status-dot" title="Verbindungsstatus"></div>
  <span id="device-info"></span>
</header>

<main>
  <div id="grid-panel">
    <div id="grid-header">
      <h2 id="grid-title">LED-Raster</h2>
      <span id="grid-hint">Gerät verbinden um das Raster zu laden.</span>
    </div>
    <div id="led-grid">
      <div id="grid-empty"></div>
    </div>
  </div>

  <aside>
    <div id="assign-pane">
      <h2>Standort zuweisen</h2>
      <div id="sel-info">0 LEDs ausgewählt</div>
      <div class="field-row">
        <label>Name</label>
        <input id="name-input" type="text" placeholder="z.B. A1" maxlength="32" autocomplete="off">
      </div>
      <div class="field-row">
        <label>Farbe</label>
        <input id="color-input" type="color" value="#ff9900">
      </div>
      <button id="btn-assign" disabled>Zuweisen</button>
      <button id="btn-clear-sel">Auswahl aufheben</button>
    </div>

    <div id="loc-wrap">
      <h2>Standorte <span id="loc-count"></span></h2>
      <div id="loc-list"><div class="loc-empty">Noch keine Standorte.</div></div>
    </div>

    <div id="actions">
      <div id="upload-msg"></div>
      <button class="abtn" id="btn-load">Mapping vom Gerät laden</button>
      <button class="abtn" id="btn-export">JSON herunterladen</button>
      <button class="abtn" id="btn-upload" disabled>Mapping hochladen (PUT /mapping)</button>
    </div>
  </aside>
</main>

<div id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────
let deviceUrl = '';
let numLeds   = 0;
let ws        = null;
let wsReady   = false;

// locations: Array<{ name: string, indices: number[], color: string }>
let locations   = [];
let selectedSet = new Set();   // selected LED indices
let activeIdx   = -1;          // which location row is highlighted in list

// drag state
let dragAnchor   = -1;
let dragLastIdx  = -1;
let dragAdding   = true;

// palette — rotates for auto-color on new location
const PALETTE = [
  '#ff9900','#3b82f6','#22c55e','#e879f9','#f43f5e',
  '#06b6d4','#facc15','#a855f7','#84cc16','#f97316'
];
let paletteOff = 0;

// ── DOM ───────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const urlInput   = $('url-input');
const btnConnect = $('btn-connect');
const statusDot  = $('status-dot');
const deviceInfo = $('device-info');
const gridTitle  = $('grid-title');
const gridHint   = $('grid-hint');
const ledGrid    = $('led-grid');
const selInfo    = $('sel-info');
const nameInput  = $('name-input');
const colorInput = $('color-input');
const btnAssign  = $('btn-assign');
const btnClearSel= $('btn-clear-sel');
const locList    = $('loc-list');
const locCount   = $('loc-count');
const btnLoad    = $('btn-load');
const btnExport  = $('btn-export');
const btnUpload  = $('btn-upload');
const uploadMsg  = $('upload-msg');
const toast      = $('toast');

// ── Toast ─────────────────────────────────────────────────────
let toastTmr;
function showToast(msg, ms = 2200) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTmr);
  toastTmr = setTimeout(() => toast.classList.remove('show'), ms);
}

// ── Connect ───────────────────────────────────────────────────
btnConnect.addEventListener('click', connect);
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });

async function connect() {
  deviceUrl = urlInput.value.trim().replace(/\/$/, '');
  if (!deviceUrl) return;
  btnConnect.disabled = true;
  btnConnect.textContent = '…';
  statusDot.className = '';
  deviceInfo.textContent = '';
  uploadMsg.textContent = '';

  try {
    const res = await fetch(deviceUrl + '/status', { signal: AbortSignal.timeout(5000) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const s = await res.json();
    numLeds = s.num_leds || 30;

    statusDot.className = 'ok';
    const parts = [];
    if (s.shelf_id != null) parts.push('Shelf ' + s.shelf_id);
    if (s.zone) parts.push(s.zone);
    parts.push(numLeds + ' LEDs');
    deviceInfo.textContent = parts.join(' · ');
    gridHint.textContent = 'Klick = auswählen · Shift+Klick = Bereich · Ziehen = mehrere';

    buildGrid();
    connectWS();
    btnUpload.disabled = false;
    showToast('Verbunden: ' + deviceUrl);
  } catch (e) {
    statusDot.className = 'err';
    deviceInfo.textContent = 'Fehler: ' + e.message;
    showToast('Verbindung fehlgeschlagen', 3000);
  } finally {
    btnConnect.disabled = false;
    btnConnect.textContent = 'Verbinden';
  }
}

// ── WebSocket ─────────────────────────────────────────────────
function connectWS() {
  if (ws) { ws.onclose = null; ws.close(); }
  const url = deviceUrl.replace(/^https?/, 'ws') + ':81';
  ws = new WebSocket(url);
  ws.onopen  = () => { wsReady = true; };
  ws.onclose = () => { wsReady = false; };
  ws.onerror = () => { wsReady = false; };
}

function wsSend(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// ── LED Grid ──────────────────────────────────────────────────
function buildGrid() {
  ledGrid.innerHTML = '';
  for (let i = 0; i < numLeds; i++) {
    const el = document.createElement('div');
    el.className = 'led';
    el.dataset.i = i;
    el.textContent = i;
    ledGrid.appendChild(el);
  }
  paintGrid();
  gridTitle.textContent = 'LED-Raster — ' + numLeds + ' LEDs';
}

// Map each LED index to its location color (last wins for overlaps)
function buildColorMap() {
  const map = new Array(numLeds).fill(null);
  for (const loc of locations)
    for (const idx of loc.indices)
      if (idx < numLeds) map[idx] = loc.color;
  return map;
}

function paintGrid() {
  const colorMap = buildColorMap();
  const els = ledGrid.querySelectorAll('.led');
  for (const el of els) {
    const i   = +el.dataset.i;
    const sel = selectedSet.has(i);
    const col = colorMap[i];
    el.className = 'led' + (sel ? ' sel' : '') + (col && !sel ? ' assigned' : '');
    el.style.background = (!sel && col) ? col : '';
    el.style.color      = (!sel && col) ? 'rgba(0,0,0,0.45)' : '';
    el.style.borderColor= '';
  }
  updateSelInfo();
}

function updateSelInfo() {
  const n = selectedSet.size;
  selInfo.textContent = n + ' LED' + (n !== 1 ? 's' : '') + ' ausgewählt';
  btnAssign.disabled = n === 0 || !nameInput.value.trim();
}

// ── Grid interaction ──────────────────────────────────────────
ledGrid.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const el = e.target.closest('.led');
  if (!el) return;
  e.preventDefault();
  const i = +el.dataset.i;

  if (e.shiftKey && selectedSet.size > 0) {
    // Extend existing selection to range
    const all = [...selectedSet, i];
    const lo = Math.min(...all), hi = Math.max(...all);
    for (let j = lo; j <= hi; j++) selectedSet.add(j);
    dragAnchor = -1;
  } else {
    // Start drag — toggle mode based on whether anchor LED was selected
    dragAdding  = !selectedSet.has(i);
    dragAnchor  = i;
    dragLastIdx = i;
    dragAdding ? selectedSet.add(i) : selectedSet.delete(i);
  }
  paintGrid();
});

ledGrid.addEventListener('mouseover', e => {
  if (dragAnchor < 0) return;
  const el = e.target.closest('.led');
  if (!el) return;
  const i = +el.dataset.i;
  if (i === dragLastIdx) return;
  dragLastIdx = i;
  const lo = Math.min(dragAnchor, i), hi = Math.max(dragAnchor, i);
  for (let j = lo; j <= hi; j++)
    dragAdding ? selectedSet.add(j) : selectedSet.delete(j);
  paintGrid();
});

document.addEventListener('mouseup', () => { dragAnchor = -1; dragLastIdx = -1; });

// ── Assign ────────────────────────────────────────────────────
nameInput.addEventListener('input', updateSelInfo);

btnAssign.addEventListener('click', () => {
  const name = nameInput.value.trim();
  if (!name || selectedSet.size === 0) return;

  const existing = locations.findIndex(l => l.name === name);
  const color = existing >= 0 ? locations[existing].color : colorInput.value;
  if (existing >= 0) locations.splice(existing, 1);

  const indices = [...selectedSet].sort((a, b) => a - b);
  locations.push({ name, indices, color });
  locations.sort((a, b) => a.name.localeCompare(b.name, 'de', { numeric: true }));

  // Advance palette only for new locations
  if (existing < 0) {
    paletteOff = (paletteOff + 1) % PALETTE.length;
    colorInput.value = PALETTE[paletteOff];
  }

  selectedSet.clear();
  nameInput.value = '';
  activeIdx = -1;
  paintGrid();
  renderLocList();
  showToast('"' + name + '" zugewiesen · ' + indices.length + ' LED' + (indices.length !== 1 ? 's' : ''));
});

btnClearSel.addEventListener('click', () => {
  selectedSet.clear();
  activeIdx = -1;
  paintGrid();
  renderLocList();
});

// ── Location list ─────────────────────────────────────────────
function renderLocList() {
  locCount.textContent = locations.length ? '(' + locations.length + ')' : '';
  if (locations.length === 0) {
    locList.innerHTML = '<div class="loc-empty">Noch keine Standorte.</div>';
    return;
  }
  locList.innerHTML = '';
  locations.forEach((loc, i) => {
    const row = document.createElement('div');
    row.className = 'loc-row' + (i === activeIdx ? ' active' : '');
    row.innerHTML =
      '<div class="loc-swatch" style="background:' + loc.color + '"></div>' +
      '<span class="loc-name">' + esc(loc.name) + '</span>' +
      '<span class="loc-count">' + loc.indices.length + '&thinsp;LED' + (loc.indices.length !== 1 ? 's' : '') + '</span>' +
      '<button class="loc-btn" title="Vorschau auf Gerät" data-act="prev" data-i="' + i + '">&#9654;</button>' +
      '<button class="loc-btn del" title="Löschen" data-act="del" data-i="' + i + '">&times;</button>';
    locList.appendChild(row);
  });

  locList.addEventListener('click', onLocListClick);
}

function onLocListClick(e) {
  const btn = e.target.closest('[data-act]');
  const row = e.target.closest('.loc-row');
  if (!row) return;
  const i = +row.querySelector('[data-i]').dataset.i;
  if (btn) {
    e.stopPropagation();
    if (btn.dataset.act === 'del') deleteLoc(i);
    if (btn.dataset.act === 'prev') previewLoc(i);
  } else {
    selectLocRow(i);
  }
}

function selectLocRow(i) {
  activeIdx = i;
  const loc = locations[i];
  selectedSet = new Set(loc.indices);
  nameInput.value = loc.name;
  colorInput.value = loc.color;
  paintGrid();
  renderLocList();
}

function deleteLoc(i) {
  const name = locations[i].name;
  locations.splice(i, 1);
  if (activeIdx === i) { activeIdx = -1; selectedSet.clear(); }
  else if (activeIdx > i) activeIdx--;
  paintGrid();
  renderLocList();
  showToast('"' + name + '" gelöscht');
}

function previewLoc(i) {
  const loc = locations[i];
  if (!wsReady) { showToast('WebSocket nicht verbunden', 2000); return; }
  // Clear first, then light the location's LEDs via multi command
  wsSend({ cmd: 'clear' });
  const hex = loc.color.replace('#', '');
  const r = parseInt(hex.slice(0, 2), 16);
  const g = parseInt(hex.slice(2, 4), 16);
  const b = parseInt(hex.slice(4, 6), 16);
  const leds = loc.indices.map(idx => ({ i: idx, r, g, b }));
  wsSend({ cmd: 'multi', leds });
  showToast('Vorschau: ' + loc.name);
}

// ── Load from device ──────────────────────────────────────────
btnLoad.addEventListener('click', async () => {
  if (!deviceUrl) { showToast('Nicht verbunden', 2000); return; }
  try {
    const res = await fetch(deviceUrl + '/mapping', { signal: AbortSignal.timeout(5000) });
    if (res.status === 404) { showToast('Kein Mapping auf dem Gerät', 2500); return; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const obj = await res.json();
    importMappingObject(obj);
    showToast('Mapping geladen — ' + locations.length + ' Standorte');
  } catch (e) {
    showToast('Laden fehlgeschlagen: ' + e.message, 3000);
  }
});

function importMappingObject(obj) {
  locations = [];
  paletteOff = 0;
  for (const [name, val] of Object.entries(obj)) {
    const indices = Array.isArray(val) ? val : [val];
    const color = PALETTE[paletteOff % PALETTE.length];
    paletteOff++;
    locations.push({ name, indices: indices.slice(), color });
  }
  locations.sort((a, b) => a.name.localeCompare(b.name, 'de', { numeric: true }));
  selectedSet.clear();
  activeIdx = -1;
  if (numLeds > 0) paintGrid();
  renderLocList();
}

// ── Export ────────────────────────────────────────────────────
btnExport.addEventListener('click', () => {
  if (locations.length === 0) { showToast('Keine Standorte zum Exportieren', 2000); return; }
  const obj = buildMappingObj();
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mapping.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('mapping.json heruntergeladen');
});

// ── Upload ────────────────────────────────────────────────────
btnUpload.addEventListener('click', async () => {
  if (!deviceUrl) { showToast('Nicht verbunden', 2000); return; }
  if (locations.length === 0) { showToast('Keine Standorte zum Hochladen', 2000); return; }
  uploadMsg.textContent = 'Lädt hoch…';
  uploadMsg.className = '';
  btnUpload.disabled = true;
  try {
    const res = await fetch(deviceUrl + '/mapping', {
      method: 'PUT',
      body: JSON.stringify(buildMappingObj()),
      headers: { 'Content-Type': 'application/json' },
      signal: AbortSignal.timeout(10000)
    });
    const data = await res.json();
    if (res.ok) {
      uploadMsg.textContent = '✓ ' + data.locations + ' Standorte gespeichert';
      uploadMsg.className = 'ok';
      showToast('Mapping erfolgreich hochgeladen');
    } else {
      uploadMsg.textContent = '✗ ' + (data.error || 'Fehler');
      uploadMsg.className = 'err';
    }
  } catch (e) {
    uploadMsg.textContent = '✗ ' + e.message;
    uploadMsg.className = 'err';
  } finally {
    btnUpload.disabled = false;
  }
});

// ── Helpers ───────────────────────────────────────────────────
function buildMappingObj() {
  const obj = {};
  for (const loc of locations)
    obj[loc.name] = loc.indices.length === 1 ? loc.indices[0] : loc.indices;
  return obj;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ──────────────────────────────────────────────────────
colorInput.value = PALETTE[0];
</script>
